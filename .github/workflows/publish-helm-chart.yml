name: Publish Helm Chart

# Publishes the umbrella chart to GitHub Pages so it can be consumed with:
#   helm repo add gpu-telemetry-stack https://victorbecerragit.github.io/k8s-gpu-telemetry-stack
#
# Triggered by a `v*` tag whose version matches `version:` in Chart.yaml.
# Can also be run manually from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and package without pushing to gh-pages"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CHART_DIR: charts/gpu-telemetry-stack
  PAGES_URL: https://victorbecerragit.github.io/k8s-gpu-telemetry-stack
  HELM_VERSION: v3.15.4

jobs:
  validate:
    name: Validate chart
    runs-on: ubuntu-latest
    outputs:
      chart-version: ${{ steps.version.outputs.chart }}
      app-version: ${{ steps.version.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo update

      - name: Build dependencies (recursive)
        run: ./scripts/build-deps.sh

      - name: Read chart versions
        id: version
        run: |
          chart="$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')"
          app="$(helm show chart "$CHART_DIR" | awk '/^appVersion:/ {print $2}' | tr -d '"')"
          echo "chart=${chart}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${chart}"
          echo "App version:   ${app}"

      - name: Verify tag matches chart version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart="${{ steps.version.outputs.chart }}"
          if [ "$tag" != "$chart" ]; then
            echo "::error::Tag v${tag} does not match Chart.yaml version ${chart}"
            echo "Bump 'version:' in ${CHART_DIR}/Chart.yaml or retag."
            exit 1
          fi
          echo "Tag v${tag} matches chart version ${chart}"

      - name: Lint
        run: ./scripts/lint.sh
        env:
          SKIP_DEPS: "true"

      - name: Render smoke test (all overlays)
        run: |
          for overlay in values-gke.yaml values-eks.yaml values-dev.yaml; do
            echo "==> ${overlay}"
            helm template gpu-telemetry "$CHART_DIR" \
              -f "$CHART_DIR/values.yaml" \
              -f "$CHART_DIR/${overlay}" > "/tmp/render-${overlay}.yaml"
            count="$(grep -c '^kind:' "/tmp/render-${overlay}.yaml" || true)"
            echo "    ${count} resources"
            if [ "${count}" -lt 50 ]; then
              echo "::error::${overlay} rendered only ${count} resources — dependencies likely missing"
              exit 1
            fi
          done

      - name: Run test suite
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest -q

  publish:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    # Always run so `dry_run` still exercises packaging and index generation;
    # only the push to gh-pages is gated below.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo update

      - name: Build dependencies (recursive)
        run: ./scripts/build-deps.sh

      - name: Package chart
        run: |
          mkdir -p .deploy
          helm package "$CHART_DIR" --destination .deploy
          ls -lh .deploy/

      - name: Build repository index
        run: |
          set -euo pipefail

          # Merge with the index already published so old versions stay installable.
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1 \
             && git cat-file -e origin/gh-pages:index.yaml 2>/dev/null; then
            echo "Merging with existing index.yaml"
            git show origin/gh-pages:index.yaml > .deploy/index-old.yaml
            helm repo index .deploy --url "$PAGES_URL" --merge .deploy/index-old.yaml
            rm -f .deploy/index-old.yaml
          else
            echo "No existing index.yaml — creating a fresh one"
            helm repo index .deploy --url "$PAGES_URL"
          fi

          echo "--- published versions ---"
          grep -E '^\s+version:' .deploy/index.yaml || true

      - name: Verify packaged chart installs
        run: |
          set -euo pipefail
          # Render straight from the .tgz to prove the package is self-contained.
          # Do NOT regenerate index.yaml here — that would drop the merged history.
          helm template smoke .deploy/gpu-telemetry-stack-*.tgz \
            -f "$CHART_DIR/values-gke.yaml" > /tmp/smoke.yaml
          count="$(grep -c '^kind:' /tmp/smoke.yaml || true)"
          echo "Packaged chart renders ${count} resources"
          [ "${count}" -ge 50 ] || { echo "::error::packaged chart renders too few resources"; exit 1; }

      - name: Publish to gh-pages
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Move artifacts out of the worktree before switching branches.
          mkdir -p /tmp/pages
          cp .deploy/*.tgz /tmp/pages/
          cp .deploy/index.yaml /tmp/pages/
          cp docs/pages/index.html /tmp/pages/

          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # Copy in new artifacts; existing .tgz files are preserved.
          cp -f /tmp/pages/*.tgz .
          cp -f /tmp/pages/index.yaml .
          cp -f /tmp/pages/index.html .

          git add -A
          git commit -m "Publish gpu-telemetry-stack v${{ needs.validate.outputs.chart-version }}" \
            -m "Chart: ${{ needs.validate.outputs.chart-version }}" \
            -m "App:   ${{ needs.validate.outputs.app-version }}" \
            || echo "Nothing to commit"
          git push origin gh-pages

          echo "Published to ${PAGES_URL}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const chart = '${{ needs.validate.outputs.chart-version }}';
            const app = '${{ needs.validate.outputs.app-version }}';
            const body = [
              `## Helm chart v${chart}`,
              '',
              '### Install',
              '```bash',
              'helm repo add gpu-telemetry-stack https://victorbecerragit.github.io/k8s-gpu-telemetry-stack',
              'helm repo update',
              'helm install gpu-telemetry gpu-telemetry-stack/gpu-telemetry-stack \\',
              '  -n gpu-telemetry --create-namespace \\',
              '  -f https://raw.githubusercontent.com/victorbecerragit/k8s-gpu-telemetry-stack/main/charts/gpu-telemetry-stack/values-gke.yaml',
              '```',
              '',
              '### Metadata',
              `- **Chart version:** \`${chart}\``,
              `- **App version:** \`${app}\``,
              `- **Chart repository:** https://victorbecerragit.github.io/k8s-gpu-telemetry-stack`,
              '',
              '### Documentation',
              '- [README](https://github.com/victorbecerragit/k8s-gpu-telemetry-stack#readme)',
              '- [Chart values](https://github.com/victorbecerragit/k8s-gpu-telemetry-stack/blob/main/charts/gpu-telemetry-stack/values.yaml)',
              '- [Contributing](https://github.com/victorbecerragit/k8s-gpu-telemetry-stack/blob/main/CONTRIBUTING.md)',
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `gpu-telemetry-stack v${chart}`,
              body,
              draft: false,
              prerelease: chart.startsWith('0.'),
            });
        continue-on-error: true
