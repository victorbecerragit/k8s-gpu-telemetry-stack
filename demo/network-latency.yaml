# Pod-to-pod TCP traffic for the eBPF latency demo.
#
# A server pod and two client pods exchange small request/response payloads in a
# tight loop. The Inspektor Gadget TCP RTT probe observes the resulting round
# trips, which is what the network panel and the GpuPodTcpLatencyHigh alert
# consume.
#
# Apply directly:
#   kubectl apply -f demo/network-latency.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latency-server
  namespace: gpu-demo
  labels:
    app.kubernetes.io/name: latency-server
    app.kubernetes.io/part-of: gpu-telemetry-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: latency-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: latency-server
        app.kubernetes.io/part-of: gpu-telemetry-stack
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import socket, threading
              def handle(conn):
                  with conn:
                      while True:
                          data = conn.recv(4096)
                          if not data:
                              return
                          conn.sendall(data)
              srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              srv.bind(("0.0.0.0", 8080))
              srv.listen(64)
              print("latency-server: listening on :8080", flush=True)
              while True:
                  conn, _ = srv.accept()
                  threading.Thread(target=handle, args=(conn,), daemon=True).start()
          ports:
            - name: tcp
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: latency-server
  namespace: gpu-demo
  labels:
    app.kubernetes.io/name: latency-server
    app.kubernetes.io/part-of: gpu-telemetry-stack
spec:
  selector:
    app.kubernetes.io/name: latency-server
  ports:
    - name: tcp
      port: 8080
      targetPort: tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latency-client
  namespace: gpu-demo
  labels:
    app.kubernetes.io/name: latency-client
    app.kubernetes.io/part-of: gpu-telemetry-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: latency-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: latency-client
        app.kubernetes.io/part-of: gpu-telemetry-stack
    spec:
      # Spread clients across nodes so traffic crosses the pod network.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: latency-client
      containers:
        - name: client
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import socket, time
              payload = b"x" * 512
              while True:
                  try:
                      with socket.create_connection(("latency-server", 8080), timeout=5) as s:
                          for _ in range(200):
                              s.sendall(payload)
                              s.recv(4096)
                  except OSError as exc:
                      print(f"latency-client: {exc}", flush=True)
                      time.sleep(1)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
