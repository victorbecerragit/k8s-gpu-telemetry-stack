  gpu-telemetry-stack:
  - annotations:
      artifacthub.io/category: monitoring-logging
      artifacthub.io/changes: |
        - kind: fixed
          description: eBPF probes now use the ig CLI image (ghcr.io/inspektor-gadget/ig) instead of the daemon image, which has no ig binary
        - kind: fixed
          description: eBPF container execs ig directly; the image is distroless and has no /bin/sh
        - kind: fixed
          description: eBPF liveness probe uses `ig version` instead of a shell test
        - kind: changed
          description: eBPF image tag pinned to v0.43.0 instead of latest
