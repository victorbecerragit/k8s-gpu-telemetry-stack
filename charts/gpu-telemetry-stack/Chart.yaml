apiVersion: v2
name: gpu-telemetry-stack
description: Production-grade GPU observability stack for Kubernetes (EKS)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: dcgm-exporter
    version: 0.1.0
    repository: file://charts/dcgm-exporter
    condition: dcgm-exporter.enabled

  - name: ebpf-probes
    version: 0.1.0
    repository: file://charts/ebpf-probes
    condition: ebpf-probes.enabled

  - name: prometheus
    version: 0.1.0
    repository: file://charts/prometheus
    condition: prometheus.enabled

  - name: grafana
    version: 0.1.0
    repository: file://charts/grafana
    condition: grafana.enabled

  - name: gpu-operator
    version: 0.1.0
    repository: file://charts/gpu-operator
    condition: gpu-operator.enabled
